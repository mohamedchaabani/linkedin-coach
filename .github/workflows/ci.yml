name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Valider le skill
        run: python tools/validate_skill.py --strict
      - name: Tests unitaires (humanizer FR/EN, archive, réseau bloqué, outils)
        run: python -m unittest discover -s tests -v
      - name: Construire l'archive pour l'app Claude
        run: python tools/build_zip.py --out dist/
