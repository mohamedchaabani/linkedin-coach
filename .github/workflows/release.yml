name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Valider le skill
        run: python tools/validate_skill.py --strict

      - name: Vérifier la cohérence des versions (tag, plugin.json, CHANGELOG)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PLUGIN=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json', encoding='utf-8'))['version'])")
          CHANGELOG=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          echo "tag=$TAG plugin=$PLUGIN changelog=$CHANGELOG"
          test "$TAG" = "$PLUGIN" && test "$TAG" = "$CHANGELOG"
          if grep -m1 -q "^## \[$TAG\] - Non publié" CHANGELOG.md; then
            echo "La première entrée du CHANGELOG doit porter une date de release." && exit 1
          fi

      - name: Tests unitaires
        run: python -m unittest discover -s tests -v

      - name: Construire l'archive
        run: python tools/build_zip.py --out dist/

      - name: Extraire les notes de version
        run: |
          awk '/^## \[/{n++} n==1' CHANGELOG.md > notes.md
          cat notes.md

      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
